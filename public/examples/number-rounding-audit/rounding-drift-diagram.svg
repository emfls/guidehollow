<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="title desc">
  <title id="title">Three-step audit workflow for AI unit conversions and rounding totals</title>
  <desc id="desc">Flow diagram comparing a flawed shortcut path using 2.2 pounds per kilogram and early rounding against a verified path that preserves exact NIST conversion factors and separates line-level from invoice-level rounding.</desc>
  <rect width="720" height="340" rx="12" fill="#0f171a"/>
  <rect x="20" y="20" width="680" height="300" rx="8" fill="#131c1f" stroke="#2a383d"/>
  <text x="40" y="54" fill="#e7eeeb" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Auditing AI Unit Conversions &amp; Rounding Drift (Fictional 5-Row Shipment)</text>
  <text x="40" y="76" fill="#a0b1b4" font-family="Inter, system-ui, sans-serif" font-size="13">Source CSV total: 30.165 kg exact · Subtotal: $476.65 USD · Tax rate: 8.25%</text>
  <rect x="40" y="98" width="296" height="196" rx="8" fill="#1a2529" stroke="#e07a5f" stroke-width="1.5"/>
  <text x="58" y="126" fill="#f4a261" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Common AI Shortcut Path (Drifts)</text>
  <text x="58" y="156" fill="#e7eeeb" font-family="Inter, system-ui, sans-serif" font-size="13">1. Uses rough 2.2 lb/kg factor:</text>
  <text x="72" y="176" fill="#f4a261" font-family="SFMono-Regular, monospace" font-size="13">30.165 × 2.2 = 66.36 lb (-0.14 lb)</text>
  <text x="58" y="206" fill="#e7eeeb" font-family="Inter, system-ui, sans-serif" font-size="13">2. Sums pre-rounded line weights:</text>
  <text x="72" y="226" fill="#f4a261" font-family="SFMono-Regular, monospace" font-size="13">11.90+14.27+12.99+11.90+15.43 = 66.49</text>
  <text x="58" y="256" fill="#e7eeeb" font-family="Inter, system-ui, sans-serif" font-size="13">3. Mixes line vs. invoice tax scope:</text>
  <text x="72" y="276" fill="#f4a261" font-family="SFMono-Regular, monospace" font-size="13">$39.33 line sum ≠ $39.32 invoice tax</text>
  <rect x="364" y="98" width="316" height="196" rx="8" fill="#1a2529" stroke="#78e8b3" stroke-width="1.5"/>
  <text x="382" y="126" fill="#78e8b3" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Verified Audit Path (Exact)</text>
  <text x="382" y="156" fill="#e7eeeb" font-family="Inter, system-ui, sans-serif" font-size="13">1. Lock exact NIST pound definition:</text>
  <text x="396" y="176" fill="#78e8b3" font-family="SFMono-Regular, monospace" font-size="13">30.165 ÷ 0.45359237 = 66.5024 lb</text>
  <text x="382" y="206" fill="#e7eeeb" font-family="Inter, system-ui, sans-serif" font-size="13">2. Round once at the final total:</text>
  <text x="396" y="226" fill="#78e8b3" font-family="SFMono-Regular, monospace" font-size="13">66.50 lb (0.00 lb rounding drift)</text>
  <text x="382" y="256" fill="#e7eeeb" font-family="Inter, system-ui, sans-serif" font-size="13">3. Declare decimal &amp; tax rounding rule:</text>
  <text x="396" y="276" fill="#78e8b3" font-family="SFMono-Regular, monospace" font-size="13">Invoice $476.65 × 8.25% = $39.32</text>
</svg>
