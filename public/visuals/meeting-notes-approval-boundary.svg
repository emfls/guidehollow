<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Meeting notes to action summary: an approval boundary</title>
<desc id="desc">Approved notes lead to confirmed decisions, assigned actions and open questions. Draft suggestions remain excluded until approved.</desc>
<rect width="1200" height="460" rx="26" fill="#eef6f1"/>
<text x="56" y="70" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#163b33">Use the notes as evidence, not permission to guess</text>
<text x="56" y="107" font-family="Arial,sans-serif" font-size="18" fill="#496c60">A clear approval boundary prevents invented tasks and deadlines.</text>
<rect x="55" y="143" width="290" height="190" rx="16" fill="#fff" stroke="#8db3a0" stroke-width="2"/>
<text x="79" y="180" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#194837">Approved meeting notes</text>
<text x="79" y="218" font-family="Arial,sans-serif" font-size="18" fill="#244d42">✓ Flyer approved</text>
<text x="79" y="250" font-family="Arial,sans-serif" font-size="18" fill="#244d42">✓ Mira assigned to draft</text>
<text x="79" y="282" font-family="Arial,sans-serif" font-size="18" fill="#244d42">✓ Due date recorded</text>
<path d="M364 242 H465" stroke="#2d7353" stroke-width="5" stroke-linecap="round"/>
<path d="M455 230 L475 242 L455 254" fill="none" stroke="#2d7353" stroke-width="5" stroke-linecap="round"/>
<rect x="495" y="143" width="300" height="190" rx="16" fill="#1e493b"/>
<text x="520" y="180" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#f5fff9">AI checks the evidence</text>
<text x="520" y="217" font-family="Arial,sans-serif" font-size="18" fill="#e4f4eb">1. Was this approved?</text>
<text x="520" y="251" font-family="Arial,sans-serif" font-size="18" fill="#e4f4eb">2. Is an owner named?</text>
<text x="520" y="285" font-family="Arial,sans-serif" font-size="18" fill="#e4f4eb">3. Is the date written?</text>
<path d="M812 242 H896" stroke="#2d7353" stroke-width="5" stroke-linecap="round"/>
<path d="M886 230 L906 242 L886 254" fill="none" stroke="#2d7353" stroke-width="5" stroke-linecap="round"/>
<rect x="925" y="143" width="220" height="190" rx="16" fill="#fff" stroke="#8db3a0" stroke-width="2"/>
<text x="946" y="180" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#194837">Action summary</text>
<text x="946" y="217" font-family="Arial,sans-serif" font-size="17" fill="#244d42">Confirmed decisions</text>
<text x="946" y="249" font-family="Arial,sans-serif" font-size="17" fill="#244d42">Assigned actions</text>
<text x="946" y="281" font-family="Arial,sans-serif" font-size="17" fill="#244d42">Open questions</text>
<rect x="55" y="355" width="1090" height="64" rx="13" fill="#fff4e7" stroke="#e7c49c"/>
<text x="78" y="395" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#79512c">Not approved?</text>
<text x="229" y="395" font-family="Arial,sans-serif" font-size="18" fill="#79512c">Keep proposals and missing owners/dates out of confirmed actions.</text>
</svg>