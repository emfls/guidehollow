name: Notion daily GuideHollow publisher
on:
  workflow_dispatch:
  # 09:17 / 15:17 / 21:17 Asia/Seoul. The repository variable is the kill switch.
  schedule:
    - cron: '17 0 * * *'
    - cron: '17 6 * * *'
    - cron: '17 12 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: guidehollow-notion-daily-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'emfls/guidehollow' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'schedule' && vars.GUIDEHOLLOW_AUTO_PUBLISH == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TZ: Asia/Seoul
      NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      # Manual runs consume the earliest unoccupied daily slot (and count toward 3/day).
      PUBLISH_SLOT: ${{ github.event.schedule == '17 0 * * *' && 'morning' || github.event.schedule == '17 6 * * *' && 'afternoon' || github.event.schedule == '17 12 * * *' && 'evening' || 'manual' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Run isolated publisher self-test
        run: |
          python scripts/notion_publish_daily.py selftest
          python -m unittest discover -s tests -p 'test_notion_publisher.py' -v

      - name: Verify baseline site quality before selecting any Notion article
        run: |
          npm ci
          npm test
          npm run check
          npm run build

      - name: Select first valid due article and quarantine invalid drafts
        id: stage
        env:
          GUIDEHOLLOW_VALIDATE_BUILD: '1'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/notion_publish_daily.py stage > /tmp/notion-result.json
          cat /tmp/notion-result.json
          python - <<'PY'
          import json, os
          row=json.load(open('/tmp/notion-result.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for field in ['status', 'file', 'url', 'page_id']:
                  out.write(f"{field}={row.get(field, '')}\n")
          PY

      - name: Full site regression
        if: steps.stage.outputs.status == 'STAGED'
        run: |
          npm ci
          npm test
          npm run check
          npm run build

      - name: Commit verified article to unprotected main (no force)
        id: article_commit
        if: steps.stage.outputs.status == 'STAGED'
        env:
          ARTICLE_FILE: ${{ steps.stage.outputs.file }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$ARTICLE_FILE"
          git add -f data/guidehollow-publication-ledger.jsonl
          git diff --cached --check
          git commit -m "content: publish one approved GuideHollow Notion article"
          # Never overwrite another editor's changes or circumvent future branch protection.
          git fetch origin main
          expected_base="$(git rev-parse HEAD^)"
          current_main="$(git rev-parse origin/main)"
          if [ "$expected_base" != "$current_main" ]; then
            echo "::error::Main advanced while publishing; stopping safely without force-push."
            exit 1
          fi
          git push origin HEAD:refs/heads/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Explicitly dispatch Pages deploy
        if: steps.stage.outputs.status == 'STAGED'
        shell: bash
        run: |
          set -euo pipefail
          # GITHUB_TOKEN pushes do not reliably initiate push workflows. workflow_dispatch does.
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/dispatches" \
            -f ref=main

      - name: Verify Pages deployment at exact source SHA
        if: steps.stage.outputs.status == 'STAGED'
        env:
          ARTICLE_SHA: ${{ steps.article_commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARTICLE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          for n in $(seq 1 70); do
            payload="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main --limit 40 --json headSha,conclusion,event)"
            if jq -e --arg sha "$ARTICLE_SHA" '[.[] | select(.headSha == $sha and .event == "workflow_dispatch" and .conclusion == "success")] | length > 0' <<< "$payload" >/dev/null; then
              echo "VERIFIED_PAGES_SHA=$ARTICLE_SHA"
              exit 0
            fi
            sleep 12
          done
          echo "::error::No Pages success for exact article SHA."
          exit 1

      - name: Verify real published URL
        if: steps.stage.outputs.status == 'STAGED'
        env:
          PUBLIC_URL: ${{ steps.stage.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,sys,time
          from html import escape
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError
          url=os.environ['PUBLIC_URL']
          for i in range(60):
              try:
                  req=Request(url+'?published-check='+str(i),headers={'Cache-Control':'no-cache'})
                  with urlopen(req,timeout=15) as response:
                      html=response.read().decode('utf-8',errors='replace')
                      if response.status==200 and 'Official sources' in html and '<meta name="google-adsense-account"' in html:
                          if 'rel="canonical" href="'+url+'"' in html:
                              print('PUBLICATION_LIVE:',url)
                              sys.exit(0)
              except (HTTPError,URLError,TimeoutError):
                  pass
              time.sleep(15)
          raise SystemExit('NOT_LIVE: public page failed 200/canonical/content checks')
          PY

      - name: Finalize Notion only after live check
        if: steps.stage.outputs.status == 'STAGED'
        env:
          NOTION_PAGE_ID: ${{ steps.stage.outputs.page_id }}
          PUBLIC_URL: ${{ steps.stage.outputs.url }}
          PUBLISHED_COMMIT_SHA: ${{ steps.article_commit.outputs.sha }}
        run: |
          python scripts/notion_publish_daily.py finalize --page-id "$NOTION_PAGE_ID" --url "$PUBLIC_URL"

      - name: Persist finalized publication ledger
        if: steps.stage.outputs.status == 'STAGED'
        shell: bash
        run: |
          set -euo pipefail
          git add -f data/guidehollow-publication-ledger.jsonl
          git diff --cached --check
          git commit -m "ledger: finalize exact deployed main article"
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)" || {
            echo "::error::Main changed; manual reconciliation required."; exit 1;
          }
          git push origin HEAD:refs/heads/main

      - name: Summary
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/notion-result.json ]; then cat /tmp/notion-result.json; fi
          echo "Invalid reviewed drafts are marked Notion 실패 + 오류; a corrected draft must be manually returned to 발행대기."
          echo "Infrastructure or post-commit uncertainty stops the release to avoid duplicate public articles."
          echo "No-queue, used-slot, or all-failed runs are not publications."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notion-daily-publish-${{ github.run_id }}
          path: /tmp/notion-result.json
          if-no-files-found: ignore
